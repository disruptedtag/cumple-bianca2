  @property --r { syntax: "<length>"; inherits: false; initial-value: -120px; }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  h1 { margin: 0; }
  html, body { height: 100%; margin: 0; background: #000; }
  body { color: #efe8f7; font-family: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  #stage { position: fixed; inset: 0; z-index: 1; overflow: auto; background: radial-gradient(ellipse at 50% 0%, #2a1748 0%, #1b1030 45%, #0f0819 100%) fixed; color: #efe8f7; font-family: "Hanken Grotesk", system-ui, sans-serif; }

  #dark {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 2rem 1.5rem; background: #000;
    --r: -120px; --cx: 50%; --cy: 50%;
    -webkit-mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent var(--r), #000 calc(var(--r) + 140px));
            mask-image: radial-gradient(circle at var(--cx) var(--cy), transparent var(--r), #000 calc(var(--r) + 140px));
  }
  #dark.opening { --r: 170vmax; transition: --r 2s cubic-bezier(.62, 0, .26, 1); }

  #lock { display: grid; justify-items: center; gap: 1.5rem; max-width: 30rem; text-align: center; }
  #lock svg { width: 3.5rem; height: 3.5rem; }
  #lock h1 { font: 400 clamp(1.75rem, 1.3rem + 2vw, 2.4rem)/1.2 "Young Serif", "Iowan Old Style", Georgia, serif; letter-spacing: -.01em; text-wrap: balance; }
  #err { display: grid; gap: .35rem; color: #ff8fa3; font-size: 1rem; line-height: 1.5; }
  #err:empty { display: none; }
  #err strong { font-weight: 600; }

  #enter { padding: 1rem 2.2rem; border: 0; border-radius: 999px; cursor: pointer; background: #efe8f7; color: #000; font: 600 1.125rem/1 "Hanken Grotesk", system-ui, sans-serif; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }

</div>

  //<crypto>
  const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const te = new TextEncoder(), S = crypto.subtle;
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = async (s) => [...new Uint8Array(await S.digest('SHA-256', te.encode(s)))].map((x) => x.toString(16).padStart(2, '0')).join('');
  const dec = async (raw, b) => {
    const d = unb64(b), k = await S.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new Uint8Array(await S.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12)));
  };
  const kdf = async (w) => {
    const m = await S.importKey('raw', te.encode(w.join('|')), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: te.encode(V.s), iterations: V.i }, m, 256));
  };
  //</crypto>

  let Mk = null;
  const text = async (b) => new TextDecoder().decode(await dec(Mk, b));

  (async () => {
    /* Lo que hay después del "?", separado por "+" */
    let raw = location.search.slice(1).split('&')[0];
    try { raw = decodeURIComponent(raw); } catch (e) {}
    const words = raw.split(/[+\s]+/).filter(Boolean);
    if (!words.length) return;
    const parts = words.map(norm);

    const lines = [], n = V.h.length;
    for (let i = 0; i < n; i++) {
      if (i >= words.length) lines.push(`Falta la respuesta ${i + 1}.`);
      else if (!V.h[i].includes(await hex(V.s + parts[i]))) lines.push(`«${words[i]}» no es correcta (respuesta ${i + 1}).`);
    }
    if (words.length > n) lines.push('Solo hay tres respuestas.');

    if (!lines.length) {
      const key = await kdf(parts);
      for (const w of V.w) { try { Mk = await dec(key, w); break; } catch (e) {} }
    }
    if (Mk) {
      $('lock').hidden = true;
      const btn = $('enter');
      btn.hidden = false;
      btn.focus();
      btn.onclick = async () => {
        btn.disabled = true;
        $('stage').innerHTML = await text(V.a);
        const io = new IntersectionObserver((es) => es.forEach((en) => {
          if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
        }), { threshold: .2, rootMargin: '0px 0px -5% 0px' });
        $('stage').querySelectorAll('.rv').forEach((el) => io.observe(el));
        const r = btn.getBoundingClientRect(), d = $('dark');
        d.style.setProperty('--cx', `${r.left + r.width / 2}px`);
        d.style.setProperty('--cy', `${r.top + r.height / 2}px`);
        requestAnimationFrame(() => d.classList.add('opening'));
        setTimeout(() => d.remove(), 2300);
      };
      return;
    }
    ['No es correcto.', ...lines].forEach((t, i) => {
      const el = document.createElement(i ? 'span' : 'strong');
      el.textContent = t;
      $('err').appendChild(el);
    });
  })();

  document.addEventListener('click', async (e) => {
    const a = e.target.closest('[data-act]');
    if (!a || !Mk) return;
    const act = a.dataset.act;
    if (act === 'no') { $('q').hidden = true; $('sad').hidden = false; }
    if (act === 'back') { $('sad').hidden = true; $('q').hidden = false; }
    if (act === 'yes') {
      $('msg').innerHTML = await text(V.m);
      $('q').hidden = true;
      $('sad').hidden = true;
      $('msg').hidden = false;
    }
  });
})();
